<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-APIs | Downloader</title>
<meta name="description" content="K-APIs Downloader — paste a link, preview media, grab the files.">
<meta name="theme-color" content="#0a0a0a">
<link id="favicon" rel="icon" href="">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/download/download.css">
</head>
<body>
<a href="#dlInput" class="skip">Skip to downloader</a>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>

<header class="topbar">
  <div class="bar-inner">
    <a href="/" class="brand" aria-label="Back home">
      <span class="mark" aria-hidden="true">KZ</span>
      <span class="brand-tx"><span id="nav-title" class="brand-nm">K-APIs</span><span class="brand-sb">DOWNLOADER</span></span>
    </a>
    <span id="statusPill" class="pill"><span class="dot"></span><span id="statusPillTxt">CONNECTING</span></span>
    <div class="bar-actions">
      <a href="/" class="iconbtn" aria-label="Home"><i class="fa-solid fa-house"></i></a>
      <a href="/ai" class="iconbtn" aria-label="AI Chat"><i class="fa-solid fa-message"></i></a>
      <a href="/search" class="iconbtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="/docs" class="iconbtn" aria-label="Docs"><i class="fa-solid fa-book"></i></a>
    </div>
  </div>
</header>

<main class="wrap layout">
  <section aria-label="Downloader">
    <div class="hero card">
      <p class="kicker">// PASTE. PREVIEW. SAVE.</p>
      <h1 id="saverTitle">SAVER</h1>
      <p class="sub" id="saverSub">Tempel link, intip hasilnya, gas download.</p>
      <form id="dlForm" class="dlbar" autocomplete="off">
        <i class="fa-solid fa-link dlic"></i>
        <input id="dlInput" type="url" inputmode="url" placeholder="https://…" aria-label="Media URL">
        <button class="btn pri" type="submit" id="dlGo"><i class="fa-solid fa-download"></i> <span>GO</span></button>
      </form>
      <div class="chips" id="sampleChips"></div>
    </div>
    <div id="dlProg" class="prog card" hidden>
      <div class="spin"></div>
      <p id="dlProgTxt">Fetching…</p>
    </div>
    <div id="dlErr" class="err card" hidden>
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div><b>FAILED</b><p id="dlErrMsg">error</p></div>
    </div>
    <article id="dlResult" class="result card" hidden aria-label="Hasil download"></article>
    <p class="hint">Mau test mentah via JSON? Buka di <a href="/docs?cat=download">docs → download</a>.</p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"><div class="toast-in"><i class="fa-solid fa-check"></i><span id="toastMsg">Copied</span></div></div>
<script src="/download/download.js"></script>
</body>
</html>
