<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuroNeko | Endpoint</title>
<meta name="description" content="Test a KuroNeko API endpoint directly.">
<meta name="theme-color" content="#0a0a0a">
<link id="favicon" rel="icon" href="">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ep/ep.css">
</head>
<body>
<a href="#epCard" class="skip">Skip to endpoint</a>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>

<header class="topbar">
  <div class="bar-inner">
    <a href="/" class="brand" aria-label="Back home">
      <span class="mark" aria-hidden="true">KN</span>
      <span class="brand-tx"><span class="brand-nm">KURO//NEKO</span><span class="brand-sb">ENDPOINT</span></span>
    </a>
    <span id="statusPill" class="pill"><span class="dot"></span><span id="statusPillTxt">CONNECTING</span></span>
    <div class="bar-actions">
      <a href="/" class="iconbtn" aria-label="Home"><i class="fa-solid fa-house"></i></a>
      <a href="/docs" class="iconbtn" aria-label="Docs"><i class="fa-solid fa-book"></i></a>
    </div>
  </div>
</header>

<main class="wrap layout">
  <div id="crumbs" class="crumbs"></div>
  <article id="epCard" class="epcard" aria-label="Endpoint tester"></article>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"><div class="toast-in"><i class="fa-solid fa-check"></i><span id="toastMsg">Copied</span></div></div>
<script src="/ep/ep.js"></script>
</body>
</html>
