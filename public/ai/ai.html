<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuroNeko | AI Zone</title>
<meta name="description" content="KuroNeko AI Zone — test every AI endpoint and chat in the Playground.">
<meta name="theme-color" content="#0a0a0a">
<link id="favicon" rel="icon" href="">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ai/ai.css">
</head>
<body>
<a href="#view-play" class="skip">Skip to playground</a>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>

<header class="topbar">
  <div class="bar-inner">
    <a href="/" class="brand" aria-label="Back home">
      <span class="mark" aria-hidden="true">KN</span>
      <span class="brand-tx"><span id="nav-title" class="brand-nm">KURO//NEKO</span><span class="brand-sb">AI ZONE</span></span>
    </a>
    <span id="statusPill" class="pill"><span class="dot"></span><span id="statusPillTxt">CONNECTING</span></span>
    <div class="bar-actions">
      <a href="/" class="iconbtn" aria-label="Home"><i class="fa-solid fa-house"></i></a>
      <a href="/download" class="iconbtn" aria-label="Downloader"><i class="fa-solid fa-download"></i></a>
      <a href="/docs" class="iconbtn" aria-label="Docs"><i class="fa-solid fa-book"></i></a>
      <a href="/stats" class="iconbtn" aria-label="Stats"><i class="fa-solid fa-chart-column"></i></a>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="AI Zone views">
    <div class="wrap tabs-in">
      <button id="tab-endpoints" class="tab active" role="tab" aria-selected="true" aria-controls="view-list"><i class="fa-solid fa-list"></i> ENDPOINTS <span class="cnt" id="aiCount">–</span></button>
      <button id="tab-play" class="tab" role="tab" aria-selected="false" aria-controls="view-play"><i class="fa-solid fa-message"></i> PLAYGROUND</button>
    </div>
  </div>
</header>

<main class="wrap layout">
  <!-- ENDPOINT LIST -->
  <section id="view-list" role="tabpanel" aria-labelledby="tab-endpoints">
    <div class="shead"><div><p class="kicker">// MODELS</p><h2>AI ENDPOINTS</h2><p class="sub">Fill params, EXECUTE, inspect JSON.</p></div></div>
    <div id="aiList" class="ailist"><div class="skel"></div><div class="skel"></div></div>
  </section>

  <!-- PLAYGROUND -->
  <section id="view-play" role="tabpanel" aria-labelledby="tab-play" hidden>
    <div class="play card">
      <div class="play-hd">
        <div class="modelpick">
          <label for="modelSel">MODEL</label>
          <select id="modelSel" aria-label="Pilih model AI"></select>
        </div>
        <div class="play-actions">
          <span id="sessBadge" class="sess" title="Session aktif">SESSION: NEW</span>
          <button id="newChatBtn" class="btn sm" type="button"><i class="fa-solid fa-plus"></i> NEW CHAT</button>
        </div>
      </div>
      <div id="chatBox" class="chat" aria-live="polite" aria-label="Chat"></div>
      <div id="typingRow" class="typing" hidden><span></span><span></span><span></span></div>
      <form id="chatForm" class="composer" autocomplete="off">
        <input id="chatInput" type="text" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)" aria-label="Tulis pesan" maxlength="2000">
        <button class="btn pri" type="submit" aria-label="Kirim"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
      <p class="hint">Playground memakai <code>session</code> bawaan endpoint — konteks chat tetap nyambung sampai NEW CHAT.</p>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"><div class="toast-in"><i class="fa-solid fa-check"></i><span id="toastMsg">Copied</span></div></div>
<script src="/ai/ai.js"></script>
</body>
</html>
